name: Deploy to GitHub Pages

# The site is plain static files at the repo root (index.html + assets/),
# so there is nothing to build — this just uploads the repo as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages, but nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; if pushes land quickly, let the in-flight
# one finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check that the entry point and its assets exist
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -d assets    || { echo "assets/ missing"; exit 1; }
          for f in assets/app.js assets/styles.css; do
            test -f "$f" || { echo "$f missing"; exit 1; }
          done
          echo "Static site looks intact."

      # The repo root is the site, but not everything at the root belongs on
      # the web. tools/ holds the generators (make-pages, make-og, make-icons,
      # make-fonts) and make-fonts keeps the UNSUBSET original of Petit Formal
      # Script as its build input — 28KB of font that nothing references and
      # every deploy was publishing anyway. Checked live: it answered 200.
      # robots.txt disallowing /tools/ only asks crawlers not to look; it does
      # not stop the file being served.
      #
      # Deliberately a denylist, not an allowlist. Forgetting to remove a file
      # here just leaves it served, which is the status quo; forgetting to
      # COPY one in an allowlist 404s the live site. The direction of the
      # failure is the whole argument.
      - name: Drop build-only files from the published artifact
        run: |
          rm -rf tools build.js CLAUDE.md
          test -f index.html || { echo "index.html went missing"; exit 1; }
          test -f assets/styles.css || { echo "assets/styles.css went missing"; exit 1; }
          test -f assets/fonts/petit-formal-script.woff2 || { echo "the subset font went missing"; exit 1; }
          test ! -e tools || { echo "tools/ survived the removal"; exit 1; }
          echo "Publishing $(find . -path ./.git -prune -o -type f -print | wc -l) files."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 minutes, and on timeout this action does not merely
          # report failure — it CANCELS the in-flight Pages deployment. A slow
          # Pages backend then turns a perfectly good publish into a red X and a
          # rolled-back deploy. Observed on 9b0338a: ten minutes of
          # `deployment_in_progress`, then `Timeout reached, aborting!` and
          # `Canceling Pages deployment`, even though the content did land.
          # Thirty minutes costs nothing when things are healthy — the step
          # still exits as soon as the deployment reports complete.
          timeout: 1800000
