name: Recheck official pages

# Reads every programme's official page on the 1st and 15th of each month,
# on GitHub's runners (the Claude sandbox cannot reach most sites), and
# records what changed since each entry was last verified. It deploys
# nothing and never touches main: the results go to the `recheck` branch,
# which `node tools/recheck.js` fetches by itself, and the worklist is shown
# on the run's summary page.
#
# It also runs after every publish that touches the data or the tools, so a
# session always finds a sweep of what is live. The schedule and the manual
# button (`node tools/sweep.js --trigger`) only work once this file is on the
# repository's DEFAULT branch: GitHub registers scheduled and dispatched
# workflows from there alone, and in October 2026 the default branch was
# still an old session branch rather than main.
on:
  push:
    branches: [main]
    paths:
      - "assets/data-*.js"
      - "tools/**"
      - ".github/workflows/recheck.yml"
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read every official page
        run: node tools/sweep.js --out sweep

      - name: Write the worklist
        run: |
          node tools/recheck.js --sweep sweep/latest.json --all --md sweep/worklist.md > sweep/worklist.txt
          cat sweep/worklist.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the recheck branch
        run: |
          cd sweep
          git init -q -b recheck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sweep of $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" recheck
